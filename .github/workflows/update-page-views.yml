name: Update Page Views

on:
  schedule:
    # 03:20 JST. Page views are low priority, so one daily refresh is enough.
    - cron: "20 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update page views
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_RUM_SITE_TAG: ${{ secrets.CLOUDFLARE_RUM_SITE_TAG }}
        run: npm run views:update

      - name: Commit updated page views
        run: |
          if git diff --quiet -- src/_data/pageViews.json; then
            echo "No page view changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/_data/pageViews.json
          git commit -m "Update page views"
          git push
