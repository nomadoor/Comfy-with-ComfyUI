name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# チェックアウトとビルド・テストだけなので読み取り権限のみ
permissions:
  contents: read

# A new push to the same pull request cancels the run that is still going; main always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. チェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js をセットアップ (20 系)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. 依存パッケージをインストール
      - name: Install dependencies
        run: npm ci

      # 4. 整合性チェック（frontmatter / nav / workflow / media など）
      - name: Run checks
        run: npm run check

      # 5. ビルド
      - name: Build site
        run: npm run build

      # 6. ビルド出力の検査（fixture の混入・未解決の /media/ 参照がないこと）
      - name: Check build output
        run: npm run check:build

      # 7. 簡易E2E（Playwright）
      #    ブラウザを最小限だけ入れて smoke を回す
      # ブラウザ本体はバージョンごとにキャッシュする。OS の依存ライブラリは毎回入れる
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers (Chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # 動画まわりのテスト（metadata 除去・サイズ取得・同期）に ffmpeg（libvpx-vp9 を含む）が必要
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run Playwright tests
        run: npm run test:playwright
