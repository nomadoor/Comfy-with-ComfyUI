name: RunPod image

# The generic ComfyUI image for the site's RunPod profiles (runpod/image/).
# Rebuilt daily so ComfyUI master in the image stays close to latest, and whenever the image changes.
on:
  schedule:
    - cron: "17 19 * * *"
  push:
    branches:
      - main
    paths:
      - "runpod/image/**"
      - ".github/workflows/runpod-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: runpod-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The CUDA + PyTorch layers need more room than the runner has free by default.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Resolve ComfyUI master
        id: comfy
        run: |
          sha=$(git ls-remote https://github.com/comfyanonymous/ComfyUI.git refs/heads/master | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y%m%d)-${sha:0:7}" >> "$GITHUB_OUTPUT"

      # main publishes :latest and a dated tag; any other branch (run by hand) only :exp, for trials.
      - name: Choose tags
        id: tags
        run: |
          image=ghcr.io/${{ github.repository_owner }}/comfy-with-comfyui-runpod
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            printf 'list<<EOF\n%s:latest\n%s:%s\nEOF\n' "$image" "$image" "${{ steps.comfy.outputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "cache=buildcache" >> "$GITHUB_OUTPUT"
          else
            printf 'list<<EOF\n%s:exp\nEOF\n' "$image" >> "$GITHUB_OUTPUT"
            echo "cache=buildcache-exp" >> "$GITHUB_OUTPUT"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: runpod/image
          build-args: COMFY_COMMIT=${{ steps.comfy.outputs.sha }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # Reuse unchanged layers (PyTorch, CUDA libraries) from the last build instead of rebuilding
          # them daily: rebuilt layers get new digests, so Pods could never reuse what a machine
          # already pulled. Only the ComfyUI layers change from day to day.
          # Trials read main's cache but write their own, so they never replace what Pods pull.
          cache-from: |
            type=registry,ref=${{ steps.tags.outputs.image }}:buildcache
            type=registry,ref=${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.cache }},mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            comfyui.commit=${{ steps.comfy.outputs.sha }}
