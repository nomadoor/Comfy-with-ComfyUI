name: RunPod image

# The generic ComfyUI image for the site's RunPod profiles (runpod/image/).
# Rebuilt daily so ComfyUI master in the image stays close to latest, and whenever the image changes.
on:
  schedule:
    - cron: "17 19 * * *"
  push:
    branches:
      - main
    paths:
      - "runpod/image/**"
      - ".github/workflows/runpod-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One group per branch: a trial build (:exp) never cancels main's. On main a running build is never
# cancelled, so :latest is never pushed to one registry and not the other; a newer main run replaces
# one still waiting, which is fine because it builds the newer commit.
concurrency:
  group: runpod-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Docker Hub (the template's registry) needs both secrets; without either, only GHCR is used.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The CUDA + PyTorch layers need more room than the runner has free by default.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Resolve ComfyUI master
        id: comfy
        run: |
          sha=$(git ls-remote https://github.com/comfyanonymous/ComfyUI.git refs/heads/master | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y%m%d)-${sha:0:7}" >> "$GITHUB_OUTPUT"

      # main publishes :latest and a dated tag; any other branch (run by hand) only :exp, for trials.
      - name: Choose tags
        id: tags
        run: |
          image=ghcr.io/${{ github.repository_owner }}/comfy-with-comfyui-runpod
          names="$image"
          if [ "$DOCKERHUB_ENABLED" = "true" ]; then names="$names docker.io/$DOCKERHUB_USERNAME/comfy-with-comfyui-runpod"; fi
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            suffixes="latest ${{ steps.comfy.outputs.tag }}"
            echo "cache=buildcache" >> "$GITHUB_OUTPUT"
          else
            suffixes="exp"
            echo "cache=buildcache-exp" >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'list<<EOF'
            for name in $names; do for suffix in $suffixes; do echo "$name:$suffix"; done; done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: runpod/image
          build-args: COMFY_COMMIT=${{ steps.comfy.outputs.sha }}
          tags: ${{ steps.tags.outputs.list }}
          # zstd layers unpack several times faster than gzip on the Pod (Docker 23+ reads them).
          outputs: type=registry,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true
          # Reuse unchanged layers (system packages, uv, Python) from the last build instead of
          # rebuilding them daily: rebuilt layers get new digests, so Pods could never reuse what a
          # machine already pulled. Only the ComfyUI layer changes from day to day.
          # Trials read main's cache but write their own, so they never replace what Pods pull.
          cache-from: |
            type=registry,ref=${{ steps.tags.outputs.image }}:buildcache
            type=registry,ref=${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.cache }},mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            comfyui.commit=${{ steps.comfy.outputs.sha }}
