# RunPod profile source. Models and custom nodes come from the workflow JSON;
# list here only what the workflows cannot say for themselves.
id: qwen-image-2-1
title: Qwen-Image-2.1
article: basic-workflows/qwen-image-2-1
# RunPod template (Matatabi AI account) the article's launch card deploys.
template: 16mbtha5fk
# Qwen Research License: research and evaluation only, no commercial use. No referral code on its card.
referral: false
workflows:
  - src/workflows/basic-workflows/qwen-image-2-1/*.json
comfyui:
  default: latest
  verified_commit: null
gpu:
  min_vram_gb: 12
  recommended_vram_gb: 24
  # Same as the template's recommended (starred) GPUs.
  recommended: [RTX 4090, RTX 5090]
  notes: ""
overrides:
  # These nodes were saved without cnr_id, so the workflow does not say where they come from.
  # Custom nodes install their latest release; add `version:` only to pin one.
  custom_nodes:
    - id: panorama-stickers
      nodes: [PanoramaPreview]
  models: []
# Turbo is close to the standard model at a fraction of the time, so a Pod opens the three main
# Turbo workflows; the rest are in the sidebar's Workflows tab, split into Turbo and Standard.
open:
  - src/workflows/basic-workflows/qwen-image-2-1/qwen_image_2_1_turbo_text2image.json
  - src/workflows/basic-workflows/qwen-image-2-1/qwen_image_2_1_turbo_ref2image.json
  - src/workflows/basic-workflows/qwen-image-2-1/qwen_image_2_1_turbo_image_edit.json
folders:
  Turbo: [src/workflows/basic-workflows/qwen-image-2-1/qwen_image_2_1_turbo_*.json]
  Standard: [src/workflows/basic-workflows/qwen-image-2-1/*.json]
